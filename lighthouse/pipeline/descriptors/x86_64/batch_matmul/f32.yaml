# This is an optimizing pipeline for simple GEMM kernels.
Pipeline:
  - include: ../matmul-like.yaml {
                                block_factors=[32,32,32]
                                tile_size=32
                                batch_tile=1
                                parallel_tiles=[8,32]
                                reduction_tiles=[2]
                                batch=1
                                unroll_reduction=false
                                fill_tiling=[1]
                                generic_tiling=[1,1,1,1,8]
                                2D_generic_tiling=[1,8]
                              }
