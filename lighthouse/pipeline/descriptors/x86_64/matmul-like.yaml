# This is an optimizing pipeline for kernel_bench matmul-like kernels.
Pipeline:
  - include: pack-and-tile.yaml {
                                  block_factors=$block_factors
                                  tile_size=$tile_size
                                }
  - schedule: "sfc.py[gen=remap]"

  ## CPU register-level tiling flow (strategy-driven)
  - pass: "linalg-morph-ops{named-to-category generic-to-named}"

  ## 2a) Parallel register tiles: assign/propagate from contraction anchors and fuse.
  - schedule: "tile_and_fuse.py[gen=assign_and_propagate_tile_sizes]{
                                                                      strategy=register_parallel
                                                                      propagate=True
                                                                    }"
  - schedule: "tile_and_fuse.py[gen=assign_elementwise_tile_sizes]{
                                                                    strategy=register_parallel
                                                                    propagate=True
                                                                  }"
  - schedule: "tile_and_fuse.py[gen=tile_and_fuse_annotated]"

  ## 2b) Reduction register tiles: annotate K-like dims and tile ops individually.
  - schedule: "tile_and_fuse.py[gen=assign_and_propagate_tile_sizes]{
                                                                      strategy=register_reduction
                                                                      propagate=False
                                                                    }"
  - schedule: "tile_and_fuse.py[gen=tile_annotated]{target_op=linalg.contract use_forall=False}"

  ## 3) Tile+unroll: annotate final unrolled tiles, optionally propagate, then tile+unroll.
  - schedule: "tile_and_fuse.py[gen=assign_and_propagate_tile_sizes]{
                                                                      strategy=register_unroll
                                                                      propagate=True
                                                                      propagate_through_loops=True
                                                                    }"
  - schedule: "tile_and_fuse.py[gen=assign_elementwise_tile_sizes]{
                                                                    strategy=register_unroll
                                                                    propagate=True
                                                                  }"
  - schedule: "tile_and_fuse.py[gen=tile_and_unroll_annotated]"

  - include: vectorize.yaml

  - include: lower.yaml
